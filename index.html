<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PU Result Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h2>University of Punjab Result Portal</h2>
</div>

<div class="main">
  <h1>RESULTS</h1>
  <div class="line"></div>

  <label>Roll No.*</label>
  <br>
  <input type="text" id="roll" placeholder="Enter Roll Number"><br><br>
  <label>Name*</label>
<input type="text" id="name" placeholder="Enter Your Name">

  <button onclick="startProcess()">Search Result</button>

  <!-- Loader -->
  <div id="loader" class="loader">
    <p>Fetching Result...</p>
    <div class="progress-bar">
      <div id="progress"></div>
    </div>
  </div>

  <!-- Fake Result -->
  <div id="resultBox" class="result-box">
  <h3>Student Result</h3>
  <p><b>Name:</b> <span id="nameDisplay"></span></p>
  <p><b>Roll No:</b> <span id="rollDisplay"></span></p>
  <p><b>Marks:</b> 132 / 550</p>
  <p style="color:red;"><b>Status:</b> FAIL</p>
</div>

<!-- Popup Meme -->
<div id="popup" class="popup">
  <div class="popup-box">
    <span class="close" onclick="nextMeme()">✖</span>
    <h2>Result Declared</h2>
    <p id="memeText"></p>
    <button onclick="nextMeme()">Close</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
